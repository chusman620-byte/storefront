<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Market</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f6f8fc;color:#18304a}header{background:#14345b;color:white;padding:22px 7%;display:flex;justify-content:space-between}main{padding:35px 7%}.hero{padding:60px 7%;background:#dfeefa}h1{font-size:42px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.item{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 12px #0001}.picture{font-size:65px;text-align:center;padding:22px;background:#edf3fa;border-radius:8px}button{background:#1765ae;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}.price{font-weight:bold}footer{text-align:center;padding:30px;color:#61758a}
</style></head><body><header><strong>DEMO MARKET</strong><span>Cart: <span id="cart">0</span></span></header><section class="hero"><h1>Shop everyday essentials</h1><p>A test e-commerce website built with ChatGPT and GitHub.</p><button onclick="document.getElementById('products').scrollIntoView()">Shop products</button></section><main id="products"><h2>Featured products</h2><p id="message">Demo only. No real orders or payments.</p><div class="grid"><div class="item"><div class="picture">🎒</div><h3>Travel Backpack</h3><p class="price">AED 89</p><button onclick="add()">Add to cart</button></div><div class="item"><div class="picture">🎧</div><h3>Wireless Headphones</h3><p class="price">AED 129</p><button onclick="add()">Add to cart</button></div><div class="item"><div class="picture">⌚</div><h3>Classic Watch</h3><p class="price">AED 149</p><button onclick="add()">Add to cart</button></div></div></main><footer>Demo Market — Preview project</footer><script>let n=0;function add(){document.getElementById('cart').textContent=++n;document.getElementById('message').textContent='Added to demo cart!';}</script></body></html>
